name: Build and publish desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Validate release version
        shell: bash
        run: |
          version="$(tr -d '\r\n ' < APP_VERSION)"
          if [[ -z "$version" ]]; then
            echo "APP_VERSION is empty" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match APP_VERSION ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build-macos-arm64:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Require support receiver configuration
        shell: bash
        env:
          ANSWER_BOOK_SUPPORT_URL: ${{ secrets.SUPPORT_RECEIVER_URL }}
          ANSWER_BOOK_SUPPORT_TOKEN: ${{ secrets.SUPPORT_RECEIVER_TOKEN }}
        run: test -n "$ANSWER_BOOK_SUPPORT_URL" && test -n "$ANSWER_BOOK_SUPPORT_TOKEN"
      - name: Require hybrid cloud configuration
        shell: bash
        env:
          ANSWER_BOOK_HYBRID_URL: ${{ secrets.HYBRID_CLOUD_URL }}
          ANSWER_BOOK_HYBRID_TOKEN: ${{ secrets.HYBRID_CLOUD_TOKEN }}
        run: test -n "$ANSWER_BOOK_HYBRID_URL" && test -n "$ANSWER_BOOK_HYBRID_TOKEN"
      - name: Build macOS package
        env:
          ANSWER_BOOK_SUPPORT_URL: ${{ secrets.SUPPORT_RECEIVER_URL }}
          ANSWER_BOOK_SUPPORT_TOKEN: ${{ secrets.SUPPORT_RECEIVER_TOKEN }}
          ANSWER_BOOK_HYBRID_URL: ${{ secrets.HYBRID_CLOUD_URL }}
          ANSWER_BOOK_HYBRID_TOKEN: ${{ secrets.HYBRID_CLOUD_TOKEN }}
          ANSWER_BOOK_HYBRID_TENANT: default
          ANSWER_BOOK_HYBRID_ENABLED: "0"
        run: python scripts/build_macos_app.py
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: dist/answer-book-platform-${{ needs.validate.outputs.version }}-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows-x86-64:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-windows.txt -r requirements-build.txt
      - name: Require support receiver configuration
        shell: bash
        env:
          ANSWER_BOOK_SUPPORT_URL: ${{ secrets.SUPPORT_RECEIVER_URL }}
          ANSWER_BOOK_SUPPORT_TOKEN: ${{ secrets.SUPPORT_RECEIVER_TOKEN }}
        run: test -n "$ANSWER_BOOK_SUPPORT_URL" && test -n "$ANSWER_BOOK_SUPPORT_TOKEN"
      - name: Require hybrid cloud configuration
        shell: bash
        env:
          ANSWER_BOOK_HYBRID_URL: ${{ secrets.HYBRID_CLOUD_URL }}
          ANSWER_BOOK_HYBRID_TOKEN: ${{ secrets.HYBRID_CLOUD_TOKEN }}
        run: test -n "$ANSWER_BOOK_HYBRID_URL" && test -n "$ANSWER_BOOK_HYBRID_TOKEN"
      - name: Build Windows package
        env:
          ANSWER_BOOK_SUPPORT_URL: ${{ secrets.SUPPORT_RECEIVER_URL }}
          ANSWER_BOOK_SUPPORT_TOKEN: ${{ secrets.SUPPORT_RECEIVER_TOKEN }}
          ANSWER_BOOK_HYBRID_URL: ${{ secrets.HYBRID_CLOUD_URL }}
          ANSWER_BOOK_HYBRID_TOKEN: ${{ secrets.HYBRID_CLOUD_TOKEN }}
          ANSWER_BOOK_HYBRID_TENANT: default
          ANSWER_BOOK_HYBRID_ENABLED: "0"
        run: python scripts/build_windows_app.py
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86-64
          path: dist/answer-book-platform-${{ needs.validate.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: [validate, build-macos-arm64, build-windows-x86-64]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
      RELEASE_REPOSITORY: xiandan-superman/answer-book-platform-releases
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/release-assets
          merge-multiple: true
      - name: Require release-repository credential
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Repository secret RELEASE_REPO_TOKEN is required for cross-repository publishing." >&2
            exit 1
          fi
      - name: Build checksum manifest and release notes
        shell: bash
        run: |
          mac_asset="dist/release-assets/answer-book-platform-${RELEASE_VERSION}-macos-arm64.dmg"
          windows_asset="dist/release-assets/answer-book-platform-${RELEASE_VERSION}-windows-x86_64.zip"
          source_asset="dist/release-assets/answer-book-platform-${RELEASE_VERSION}-source.zip"
          python scripts/package_release.py --output "$source_asset"
          python scripts/verify_release_package.py --zip "$source_asset"
          python scripts/extract_release_notes.py --version "$RELEASE_VERSION" --output dist/release-notes.md
          python scripts/build_update_manifest.py \
            --version "$RELEASE_VERSION" \
            --release-tag "$RELEASE_TAG" \
            --notes-file dist/release-notes.md \
            --asset "source=$source_asset" \
            --asset "macos-arm64=$mac_asset" \
            --asset "windows-x86_64=$windows_asset" \
            --output dist/release-assets/update-manifest.json
      - name: Publish GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release-assets/* --repo "$RELEASE_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/release-assets/* \
              --repo "$RELEASE_REPOSITORY" \
              --title "真题解析与生题平台 ${RELEASE_VERSION}" \
              --notes-file dist/release-notes.md
          fi
      - name: Update stable feed
        shell: bash
        run: |
          content="$(base64 -w 0 dist/release-assets/update-manifest.json)"
          sha="$(gh api "repos/${RELEASE_REPOSITORY}/contents/update-stable.json" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${RELEASE_REPOSITORY}/contents/update-stable.json" -f message="release: update stable feed to ${RELEASE_VERSION}" -f content="$content")
          if [[ -n "$sha" ]]; then
            args+=(-f sha="$sha")
          fi
          gh api "${args[@]}"
