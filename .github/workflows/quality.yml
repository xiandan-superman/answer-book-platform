name: Platform quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-plan:
    runs-on: ubuntu-latest
    outputs:
      release-required: ${{ steps.plan.outputs.release-required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether this commit can publish a new source version
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < APP_VERSION)"
          test -n "$version"
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "release-required=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "release-required=false" >> "$GITHUB_OUTPUT"
            echo "Version v${version} is already tagged; run the everyday gate only."
          else
            echo "release-required=true" >> "$GITHUB_OUTPUT"
            echo "Version v${version} is unpublished; run the complete release matrix."
          fi

  python-quality:
    needs: release-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked runtime and development dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints-py311.txt
      - name: Run everyday or complete release quality gate
        shell: bash
        env:
          RELEASE_REQUIRED: ${{ needs.release-plan.outputs.release-required }}
        run: |
          if [[ "$RELEASE_REQUIRED" == "true" ]]; then
            python scripts/run_quality_gates.py --full
          else
            python scripts/run_quality_gates.py
          fi

  browser-smoke:
    runs-on: ubuntu-latest
    needs: release-plan
    if: needs.release-plan.outputs.release-required == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install browser test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints-py311.txt
          python -m playwright install --with-deps chromium
      - name: Run critical Chromium flows
        run: python -m pytest -q -m e2e tests/e2e/test_platform_smoke.py

  source-dependency-locks:
    name: Source dependency locks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: release-plan
    if: needs.release-plan.outputs.release-required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python-version: "3.11"
            base-constraint: constraints-py311.txt
            platform-constraint: constraints-source-macos-py311.txt
          - os: windows-latest
            python-version: "3.11"
            base-constraint: constraints-py311.txt
            platform-constraint: constraints-source-windows-py311.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked macOS source runtime
        if: runner.os == 'macOS'
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -r requirements.txt
          -c ${{ matrix.base-constraint }}
          -c ${{ matrix.platform-constraint }}
      - name: Install locked Windows source runtime
        if: runner.os == 'Windows'
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -r requirements.txt -r requirements-windows.txt
          -c ${{ matrix.base-constraint }}
          -c ${{ matrix.platform-constraint }}
      - name: Validate resolved source runtime
        run: |
          python -m pip check
          python -c "import docx,lxml,latex2mathml,PIL,pydantic,pypdfium2,bm25s,huey,matplotlib,numpy,webview,pystray"
      - name: Validate Windows Word integration import
        if: runner.os == 'Windows'
        run: python -c "import win32com.client"

  quality-complete:
    runs-on: ubuntu-latest
    if: always()
    needs: [release-plan, python-quality, browser-smoke, source-dependency-locks]
    env:
      PLAN_RESULT: ${{ needs.release-plan.result }}
      PYTHON_RESULT: ${{ needs.python-quality.result }}
      BROWSER_RESULT: ${{ needs.browser-smoke.result }}
      LOCKS_RESULT: ${{ needs.source-dependency-locks.result }}
      RELEASE_REQUIRED: ${{ needs.release-plan.outputs.release-required }}
    steps:
      - name: Require the correct gate set for this commit
        shell: bash
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = "success"
          test "$PYTHON_RESULT" = "success"
          if [[ "$RELEASE_REQUIRED" == "true" ]]; then
            test "$BROWSER_RESULT" = "success"
            test "$LOCKS_RESULT" = "success"
          else
            test "$BROWSER_RESULT" = "skipped"
            test "$LOCKS_RESULT" = "skipped"
          fi
