name: Platform quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked runtime and development dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          constraint="constraints-py311.txt"
          if [[ "${{ matrix.python-version }}" == "3.9" ]]; then constraint="constraints-py39.txt"; fi
          python -m pip install -r requirements.txt -r requirements-dev.txt -c "$constraint"
      - name: Run supported-version quality gate
        shell: bash
        run: |
          if [[ "${{ matrix.python-version }}" == "3.11" ]]; then
            python scripts/run_quality_gates.py --full
          else
            python scripts/run_quality_gates.py
          fi

  browser-smoke:
    runs-on: ubuntu-latest
    needs: python-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install browser test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints-py311.txt
          python -m playwright install --with-deps chromium
      - name: Run critical Chromium flows
        run: python -m pytest -q -m e2e tests/e2e/test_platform_smoke.py
