name: Build Windows internal package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-windows.txt -r requirements-build.txt
      - name: Build package
        run: python scripts/build_windows_app.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-internal-package
          path: dist/answer-book-platform-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
