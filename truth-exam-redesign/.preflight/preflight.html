<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* 智能真题解析系统 · 视觉升级 — 学术靛蓝主色体系 */
:root {
  color-scheme: light;

  /* ===== Surface neutrals (warm paper undertone) ===== */
  --brand-background: #f7f8fb;
  --brand-foreground: #1a2233;
  --brand-card: #ffffff;
  --brand-card-foreground: #1a2233;
  --brand-popover: #ffffff;
  --brand-popover-foreground: #1a2233;
  --brand-muted: #eef1f6;
  --brand-muted-foreground: #5b6678;
  --brand-border: #e2e7f0;
  --brand-input: #e2e7f0;
  --brand-ring: #1e3a8a;

  /* ===== Single primary brand hue: academic indigo ===== */
  --brand-primary: #1e3a8a;
  --brand-primary-foreground: #ffffff;

  /* ===== Radius scale (2/4/8/16) ===== */
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 16px;

  /* ===== Semantic state colors (not brand) ===== */
  --state-success: #047857;
  --state-warning: #b45309;
  --state-error: #b91c1c;
  --state-info: #1e3a8a;

  /* ===== Typography stacks ===== */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", monospace;

  /* ===== Depth ===== */
  --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.02);
  --shadow-float: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --shadow-overlay: 0 24px 60px -20px rgba(15, 23, 42, 0.22);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
