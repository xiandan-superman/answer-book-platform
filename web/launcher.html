<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>启动真题解析平台</title>
  <link rel="icon" type="image/png" href="/app-icon.png">
  <style>
    :root{color-scheme:light;--ink:#15213b;--muted:#6f7b91;--line:#e5eaf2;--blue:#246bfd;--blue2:#1557d8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -10%,#e7efff 0,transparent 38%),#f6f8fc;display:grid;place-items:center;padding:28px}
    .shell{width:min(720px,100%)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px}.logo{width:48px;height:48px;border-radius:14px;display:block;box-shadow:0 10px 24px #246bfd35}.brand-name{font-size:16px;font-weight:700;letter-spacing:.02em}
    .panel{background:#fff;border:1px solid #e8edf5;border-radius:24px;padding:42px 48px 38px;box-shadow:0 22px 65px rgba(31,48,84,.10)}h1{font-size:28px;line-height:1.35;text-align:center;margin:0;font-weight:750}.lead{text-align:center;color:var(--muted);font-size:14px;margin:9px 0 30px}
    .label{font-size:13px;font-weight:700;margin:0 0 9px}.switch{display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:13px;background:#f0f3f8;gap:4px}.switch button{border:0;border-radius:9px;padding:12px 16px;background:transparent;color:#6a768a;font:600 14px inherit;cursor:pointer;transition:.18s}.switch button.active{background:#fff;color:#1f5fd1;box-shadow:0 2px 9px rgba(31,48,84,.11)}
    .mode-detail{min-height:66px;margin:14px 2px 22px;padding-left:18px;position:relative}.mode-detail:before{content:"";position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:50%;background:#34a853;box-shadow:0 0 0 5px #e9f7ee}.mode-title{font-size:14px;font-weight:700}.mode-copy{color:var(--muted);font-size:13px;line-height:1.7;margin-top:4px}
    .primary{width:100%;border:0;border-radius:12px;padding:14px 20px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font:700 15px inherit;cursor:pointer;box-shadow:0 10px 22px #246bfd2c;transition:.18s}.primary:hover{transform:translateY(-1px);box-shadow:0 13px 28px #246bfd38}.primary:disabled{cursor:default;transform:none;background:#aab6ca;box-shadow:none}
    .status{display:none;margin-top:22px;padding:18px 20px;border:1px solid var(--line);border-radius:13px;background:#fbfcfe}.status.show{display:block}.status-row{display:flex;align-items:center;gap:11px}.spinner{width:18px;height:18px;flex:0 0 auto;border:2px solid #dce5f4;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}.status.ready .spinner{animation:none;border:0;background:#2fad66;box-shadow:inset 0 0 0 5px #eaf8f0}.status.failed{border-color:#f0cccc;background:#fffafa}.status.failed .spinner{animation:none;border:0;background:#e05252;box-shadow:inset 0 0 0 5px #fff0f0}.status-copy{min-width:0}.status-stage{color:#2864d7;font-size:12px;font-weight:700;margin-bottom:3px}.status.failed .status-stage{color:#c84848}.status-text{font-size:14px;font-weight:650;overflow-wrap:anywhere}.progress-wrap{display:none;margin:15px 0 0 29px}.progress-wrap.show{display:block}.progress-meta{display:flex;justify-content:space-between;gap:12px;color:#768299;font-size:12px;margin-bottom:7px}.progress-track{height:7px;overflow:hidden;border-radius:99px;background:#e5eaf2}.progress-bar{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#246bfd,#5d67e9);transition:width .25s ease}.progress-track.indeterminate .progress-bar{width:35%!important;animation:slide 1.35s ease-in-out infinite}.progress-detail{color:#6f7b91;font-size:12px;line-height:1.65;margin-top:8px;overflow-wrap:anywhere}.progress-hint{display:none;color:#a13f3f;font-size:12px;line-height:1.6;margin-top:8px}.status.failed .progress-hint{display:block}.status-actions{display:flex;flex-wrap:wrap;gap:16px;margin:13px 0 0 29px}.link{border:0;background:none;padding:0;color:#2864d7;font:600 13px inherit;cursor:pointer}.link.danger{color:#c84848}
    .facts{display:flex;justify-content:center;gap:22px;color:#8a95a8;font-size:12px;margin-top:24px}.facts span:before{content:"✓";color:#42a66b;font-weight:800;margin-right:6px}.note{text-align:center;color:#9aa4b5;font-size:11px;margin:18px 0 0}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes slide{0%{transform:translateX(-120%)}50%{transform:translateX(120%)}100%{transform:translateX(300%)}}@media(max-width:620px){.panel{padding:32px 24px;border-radius:20px}h1{font-size:24px}.facts{gap:10px;flex-wrap:wrap}}
  </style>
</head>
<body>
  <main class="shell"><div class="brand"><img class="logo" src="/app-icon.png" alt=""><div class="brand-name">真题解析与生题平台</div></div>
    <section class="panel"><h1>准备开始</h1><p class="lead">启动器会自动检查运行环境，无需手动安装项目依赖</p>
      <p class="label">访问方式</p><div class="switch" role="tablist" aria-label="访问方式"><button id="localMode" class="active" type="button">仅本机使用</button><button id="lanMode" type="button">局域网监控</button></div>
      <div class="mode-detail"><div id="modeTitle" class="mode-title">安全的本机模式</div><div id="modeCopy" class="mode-copy">只有当前电脑可以访问，适合日常出题、管理和下载文件。</div></div>
      <button id="startButton" class="primary" type="button">启动平台</button>
      <div id="statusBox" class="status" aria-live="polite" aria-atomic="false"><div class="status-row"><span class="spinner" aria-hidden="true"></span><div class="status-copy"><div id="statusStage" class="status-stage">准备启动</div><div id="statusText" class="status-text">正在准备</div></div></div><div id="progressWrap" class="progress-wrap"><div class="progress-meta"><span id="progressCount">正在检查所需组件</span><span id="progressPercent"></span></div><div id="progressTrack" class="progress-track" role="progressbar" aria-label="启动准备进度" aria-valuemin="0" aria-valuemax="100"><div id="progressBar" class="progress-bar"></div></div><div id="progressDetail" class="progress-detail"></div><div id="progressHint" class="progress-hint"></div></div><div class="status-actions"><button id="openButton" class="link" type="button">打开平台</button><button id="copyLogButton" class="link" type="button">复制日志位置</button><button id="stopButton" class="link danger" type="button">停止平台</button></div></div>
      <div class="facts"><span>自动检查依赖</span><span>数据保存在本机</span><span>后台托盘运行</span></div><p class="note">启动成功后窗口会自动隐藏；从系统托盘或菜单栏可重新打开</p>
    </section>
  </main>
  <script>
    let selectedMode='local',lastState={};const $=id=>document.getElementById(id),local=$('localMode'),lan=$('lanMode'),start=$('startButton'),box=$('statusBox'),statusText=$('statusText'),statusStage=$('statusStage'),open=$('openButton'),stop=$('stopButton'),copyLog=$('copyLogButton'),progressWrap=$('progressWrap'),progressTrack=$('progressTrack'),progressBar=$('progressBar'),progressCount=$('progressCount'),progressPercent=$('progressPercent'),progressDetail=$('progressDetail'),progressHint=$('progressHint');
    const stageNames={checking_dependencies:'检查运行环境',creating_environment:'创建专用环境',dependencies_found:'发现待安装组件',resolving_dependencies:'解析组件版本',downloading_dependencies:'下载并准备组件',installing_dependencies:'安装运行组件',verifying_dependencies:'验证安装结果',dependencies_ready:'运行组件已就绪',starting:'启动平台服务',completed:'启动完成',failed:'准备失败'};
    function choose(mode){selectedMode=mode;local.classList.toggle('active',mode==='local');lan.classList.toggle('active',mode==='lan');$('modeTitle').textContent=mode==='local'?'安全的本机模式':'受密码保护的监控模式';$('modeCopy').textContent=mode==='local'?'只有当前电脑可以访问，适合日常出题、管理和下载文件。':'允许局域网或 Tailscale 内的设备查看运行监控；地址与账号在平台内显示。'}
    async function post(path,payload={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Launcher-Request':'1'},body:JSON.stringify(payload)}),data=await r.json();if(!r.ok)throw new Error(data.message||'操作失败');return data}
    function renderState(s){lastState=s;if(s.status==='idle'){box.className='status';start.disabled=false;start.textContent='启动平台';return}box.className='status show '+s.status;statusStage.textContent=stageNames[s.stage]||(s.status==='ready'?'运行正常':s.status==='failed'?'启动失败':'准备启动');statusText.textContent=s.message;start.disabled=s.status==='starting'||s.status==='ready';start.textContent=s.status==='failed'?'重新尝试':'启动平台';open.style.display=s.status==='ready'?'inline':'none';stop.style.display=s.can_stop?'inline':'none';copyLog.style.display=s.status==='failed'?'inline':'none';const hasProgress=s.status==='starting'||s.status==='failed';progressWrap.classList.toggle('show',hasProgress);if(!hasProgress)return;const percent=Math.max(0,Math.min(100,Number(s.percent)||0)),indeterminate=s.progress_mode==='indeterminate';progressTrack.classList.toggle('indeterminate',indeterminate);progressBar.style.width=percent+'%';progressTrack.setAttribute('aria-valuenow',String(percent));progressPercent.textContent=indeterminate?'处理中':percent+'%';const total=Number(s.total_count)||0,current=Number(s.current_index)||0,completed=Number(s.completed_count)||0;progressCount.textContent=total?(current?`${s.status==='failed'?'中断于':'第'} ${current}/${total} 项`:`已完成 ${completed}/${total} 项`):'正在检查所需组件';const details=[],component=s.current_component||s.failed_component;if(component)details.push((s.status==='failed'?'失败组件：':'当前安装：')+component);if(!component&&Array.isArray(s.pending_components)&&s.pending_components.length){const preview=s.pending_components.slice(0,6).join('、'),more=s.pending_components.length>6?` 等 ${s.pending_components.length} 项`:'';details.push('待安装：'+preview+more)}if(Number(s.inactive_seconds)>=45)details.push('最近活动：'+s.inactive_seconds+' 秒前');progressDetail.textContent=details.join(' · ')||'启动器会自动完成，无需手动操作';progressHint.textContent=s.hint||'可重新尝试；若仍失败，请复制日志位置提供给维护人员。'}
    async function refresh(){try{const r=await fetch('/api/state',{cache:'no-store'}),s=await r.json();renderState(s)}catch(_e){}finally{setTimeout(refresh,800)}}
    async function begin(){box.className='status show starting';statusStage.textContent='准备启动';statusText.textContent='正在开始…';start.disabled=true;try{await post('/api/start',{mode:selectedMode})}catch(e){box.className='status show failed';statusStage.textContent='启动失败';statusText.textContent=e.message;start.disabled=false}}
    local.onclick=()=>choose('local');lan.onclick=()=>choose('lan');start.onclick=begin;open.onclick=()=>post('/api/open');copyLog.onclick=async()=>{const value=lastState.log_path||'';if(!value)return;try{await navigator.clipboard.writeText(value);copyLog.textContent='已复制';setTimeout(()=>copyLog.textContent='复制日志位置',1600)}catch(_e){progressHint.textContent='日志位置：'+value}};stop.onclick=async()=>{await post('/api/stop');refresh()};choose('local');refresh();
  </script>
</body></html>
